name: TiresHub CI

on:
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Installera .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Hämta NuGet-paket
        run: dotnet restore

      - name: Bygg lösningen
        run: dotnet build --no-restore

      - name: Kör tester
        run: dotnet test --no-build
